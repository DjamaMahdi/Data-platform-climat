name: Monthly ERA5 pipeline

# Runs the General ERA5 -> MotherDuck -> dbt -> R2 pipeline once a month, then
# triggers the Vercel portal to ingest the refreshed gold parquet files.
#
# The Agriculture pipeline is intentionally NOT run here: it is slow (5 CDS
# variables + a ~600k-row mart rebuild) and the portal sync excludes it anyway
# (its parquet->XLSX conversion exceeds the Vercel Hobby 60s limit). Run it
# manually when needed: `python scripts/run_pipeline.py --target agriculture`.
#
# The 6th of each month at 03:00 UTC is safely past the ERA5 monthly-means
# 2-month publication lag.

on:
  schedule:
    - cron: "0 3 6 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-era5
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment: Secret
    timeout-minutes: 350
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run ERA5 pipeline (General only)
        run: python scripts/run_pipeline.py --target general

      - name: Trigger portal sync
        env:
          PORTAL_SYNC_URL: ${{ secrets.PORTAL_SYNC_URL }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
        run: |
          curl -fsS -X POST "$PORTAL_SYNC_URL" \
            -H "x-admin-secret: $ADMIN_SYNC_SECRET"
